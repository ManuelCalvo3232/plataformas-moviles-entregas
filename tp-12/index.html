<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editor de Texto - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Editor de Texto</h1>
        <div class="card">
            <div class="card-body">
                <h2>Texto</h2>

                <div class="mb-3">
                    <label for="entrada-texto" class="form-label">Editar texto</label>
                    <input type="text" class="form-control" id="entrada-texto" value="Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec elementum auctor libero, vel imperdiet est. Etiam blandit facilisis ex, nec cursus metus pharetra quis. Fusce imperdiet nisl nibh, ac aliquet ante elementum vitae.">
                </div>

                <p class="texto" id="texto">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec elementum auctor libero, vel imperdiet est. Etiam blandit facilisis ex, nec cursus metus pharetra quis. Fusce imperdiet nisl nibh, ac aliquet ante elementum vitae.</p>

                <hr class="hr">

                <h2>Opciones de Formato</h2>
                <div class="row">
                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-negrita" class="btn d-block w-100 btn-primary" data-formato="negrita" aria-pressed="false">
                            Bold (Negrita)
                        </button>
                    </div>
                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-cursiva" class="btn d-block w-100 btn-primary" data-formato="cursiva" aria-pressed="false">
                            Italic (Cursiva)
                        </button>
                    </div>
                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-subrayado" class="btn d-block w-100 btn-primary" data-formato="subrayado" aria-pressed="false">
                            Underline (Subrayado)
                        </button>
                    </div>
                </div>

                <div class="row mt-2">
                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-color" class="btn d-block w-100 btn-primary" data-formato="color">
                            Color del texto
                        </button>
                    </div>
                    <div class="col-12 col-md-8 my-1">
                        <label for="tamano" class="form-label">Tamaño del texto</label>
                        <input type="range" class="form-range" id="tamano" min="12" max="40" value="16">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script type="text/javascript">
        const texto = document.getElementById('texto');
        const estilos = { negrita: false, cursiva: false, subrayado: false };
        const botones = {
            negrita: document.getElementById('btn-negrita'),
            cursiva: document.getElementById('btn-cursiva'),
            subrayado: document.getElementById('btn-subrayado')
        };
        const colores = ['#212529', '#dc3545', '#0d6efd', '#198754'];
        let indiceColor = 0;

        /**
         * Aplica al párrafo el estado actual de los estilos.
         */
        function actualizarTexto() {
            texto.style.fontWeight = estilos.negrita ? 'bold' : 'normal';
            texto.style.fontStyle = estilos.cursiva ? 'italic' : 'normal';
            texto.style.textDecoration = estilos.subrayado ? 'underline' : 'none';
        }

        /**
         * Muestra en el botón si el estilo está activado (verde) o no (azul).
         */
        function actualizarBoton(formato) {
            const activo = estilos[formato];
            botones[formato].classList.toggle('btn-success', activo);
            botones[formato].classList.toggle('btn-primary', !activo);
            botones[formato].setAttribute('aria-pressed', activo);
        }

        function alternarEstilo(formato) {
            estilos[formato] = !estilos[formato];
            actualizarTexto();
            actualizarBoton(formato);
        }

        /**
         * funcionNegrita()
         * Esta función se ejecuta cuando el usuario selecciona la opción Bold (negrita).
         */
        function funcionNegrita() {
            alternarEstilo('negrita');
        }

        /**
         * funcionCursiva()
         * Esta función se ejecuta cuando el usuario selecciona la opción Italic (cursiva).
         */
        function funcionCursiva() {
            alternarEstilo('cursiva');
        }

        /**
         * funcionSubrayado()
         * Esta función se ejecuta cuando el usuario selecciona la opción Underline (subrayado).
         */
        function funcionSubrayado() {
            alternarEstilo('subrayado');
        }

        /**
         * funcionColor()
         * Cambia el color del texto por el siguiente de la lista.
         */
        function funcionColor() {
            indiceColor = (indiceColor + 1) % colores.length;
            texto.style.color = colores[indiceColor];
        }

        function handlerBoton(e) {
            // Obtiene el valor del atributo "data-formato" del botón que disparó el evento
            const funcionBoton = e.target.dataset.formato;
            switch (funcionBoton) {
                case 'negrita':
                    funcionNegrita();
                    break;
                case 'cursiva':
                    funcionCursiva();
                    break;
                case 'subrayado':
                    funcionSubrayado();
                    break;
                case 'color':
                    funcionColor();
                    break;
            }
        }
        document.querySelectorAll('button.btn').forEach(e => e.addEventListener('click', handlerBoton));

        document.getElementById('entrada-texto').addEventListener('input', e => {
            texto.textContent = e.target.value;
        });

        document.getElementById('tamano').addEventListener('input', e => {
            texto.style.fontSize = e.target.value + 'px';
        });
    </script>
</body>
</html>
