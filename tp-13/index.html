<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Compras - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Lista de Compras</h1>
        <div class="card">
            <div class="card-body">
                <h2>Listado de Productos</h2>

                <ul id="lista-productos" class="list-group mb-3">
                    <li>Pan</li>
                </ul>

                <div class="d-flex gap-2 mb-3">
                    <button id="btn-ordenar" type="button" class="btn btn-outline-secondary">Ordenar alfabéticamente</button>
                    <button id="btn-limpiar" type="button" class="btn btn-outline-danger">Limpiar lista</button>
                </div>

                <hr class="hr">

                <h2>Agregar Producto</h2>
                <form id="form-producto">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" aria-label="Nombre del Producto">
                        <button class="btn btn-primary" type="submit">Agregar Producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script type="text/javascript">
        const lista = document.getElementById('lista-productos');

        /**
         * Crea el elemento de la lista con el nombre del producto y su botón de eliminar.
         */
        function crearItem(nombre) {
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';

            const texto = document.createElement('span');
            texto.textContent = nombre;

            const btnEliminar = document.createElement('button');
            btnEliminar.type = 'button';
            btnEliminar.className = 'btn btn-sm btn-outline-danger btn-eliminar';
            btnEliminar.textContent = 'Eliminar';

            li.append(texto, btnEliminar);
            return li;
        }

        // Los productos que ya están en el HTML inicial también reciben su botón de eliminar
        lista.querySelectorAll('li').forEach(li => li.replaceWith(crearItem(li.textContent.trim())));

        /**
         * agregarProducto()
         * esta función se va a llamar cuando el usuario envía el formulario con el nombre del producto para agregar.
         */
        function agregarProducto(nombreProducto) {
            const nombre = nombreProducto.trim();
            if (nombre === '') return;
            lista.appendChild(crearItem(nombre));
        }

        function ordenarLista() {
            const items = Array.from(lista.children);
            items.sort((a, b) => a.querySelector('span').textContent.localeCompare(b.querySelector('span').textContent, 'es'));
            items.forEach(li => lista.appendChild(li));
        }

        function limpiarLista() {
            lista.innerHTML = '';
        }

        // Delegación: un solo listener para los botones "Eliminar" de todos los productos
        lista.addEventListener('click', e => {
            if (e.target.classList.contains('btn-eliminar')) {
                e.target.closest('li').remove();
            }
        });

        document.getElementById('btn-ordenar').addEventListener('click', ordenarLista);
        document.getElementById('btn-limpiar').addEventListener('click', limpiarLista);

        function handlerFormulario(evento) {
            evento.preventDefault();
            const input = evento.target.querySelector('input');
            const nombreProducto = input.value;
            input.value = "";
            agregarProducto(nombreProducto);
        }

        document.querySelector('form').addEventListener('submit', handlerFormulario);
    </script>
</body>
</html>
