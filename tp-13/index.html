<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Compras - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Lista de Compras</h1>
        <div class="card">
            <div class="card-body">
                <h2>Listado de Productos</h2>

                <ul id="lista-productos" class="list-group mb-3">
                    <li>Pan</li>
                </ul>

                <div class="d-flex gap-2 mb-3">
                    <button id="btn-ordenar" type="button" class="btn btn-outline-secondary">Ordenar alfabéticamente</button>
                    <button id="btn-limpiar" type="button" class="btn btn-outline-danger">Limpiar lista</button>
                </div>

                <hr class="hr">

                <h2>Agregar Producto</h2>
                <form id="form-producto">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" aria-label="Nombre del Producto">
                        <button class="btn btn-primary" type="submit">Agregar Producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script type="text/javascript">
        const lista = document.getElementById('lista-productos');
        const CLAVE_STORAGE = 'lista-compras';
        let editando = null;

        function cargarProductos() {
            const guardados = localStorage.getItem(CLAVE_STORAGE);
            if (guardados !== null) return JSON.parse(guardados);
            return Array.from(lista.querySelectorAll('li'), li => ({ nombre: li.textContent.trim(), comprado: false }));
        }

        let productos = cargarProductos();

        function guardar() {
            localStorage.setItem(CLAVE_STORAGE, JSON.stringify(productos));
            renderizar();
        }

        function renderizar() {
            lista.innerHTML = '';
            productos.forEach((producto, indice) => lista.appendChild(crearItem(producto, indice)));
            lista.querySelector('.input-edicion')?.focus();
        }

        /**
         * Crea el elemento de la lista con su casilla de comprado, nombre y botones de editar y eliminar.
         */
        function crearItem(producto, indice) {
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';
            li.dataset.indice = indice;

            const izquierda = document.createElement('div');
            izquierda.className = 'd-flex align-items-center gap-2';

            const check = document.createElement('input');
            check.type = 'checkbox';
            check.className = 'form-check-input mt-0 check-comprado';
            check.checked = producto.comprado;

            if (indice === editando) {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'form-control form-control-sm input-edicion';
                input.value = producto.nombre;
                izquierda.append(check, input);
            } else {
                const texto = document.createElement('span');
                texto.textContent = producto.nombre;
                texto.classList.toggle('text-decoration-line-through', producto.comprado);
                texto.classList.toggle('text-muted', producto.comprado);
                izquierda.append(check, texto);
            }

            const derecha = document.createElement('div');
            derecha.className = 'd-flex gap-2';

            const btnEditar = document.createElement('button');
            btnEditar.type = 'button';
            btnEditar.className = 'btn btn-sm btn-outline-primary btn-editar';
            btnEditar.textContent = 'Editar';

            const btnEliminar = document.createElement('button');
            btnEliminar.type = 'button';
            btnEliminar.className = 'btn btn-sm btn-outline-danger btn-eliminar';
            btnEliminar.textContent = 'Eliminar';

            derecha.append(btnEditar, btnEliminar);
            li.append(izquierda, derecha);
            return li;
        }

        /**
         * agregarProducto()
         * esta función se va a llamar cuando el usuario envía el formulario con el nombre del producto para agregar.
         */
        function agregarProducto(nombreProducto) {
            const nombre = nombreProducto.trim();
            if (nombre === '') return;
            productos.push({ nombre, comprado: false });
            guardar();
        }

        function ordenarLista() {
            editando = null;
            productos.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
            guardar();
        }

        function limpiarLista() {
            editando = null;
            productos = [];
            guardar();
        }

        function guardarEdicion(valor) {
            if (editando === null) return;
            const nombre = valor.trim();
            if (nombre !== '') productos[editando].nombre = nombre;
            editando = null;
            guardar();
        }

        lista.addEventListener('click', e => {
            const indice = Number(e.target.closest('li')?.dataset.indice);
            if (e.target.classList.contains('btn-eliminar')) {
                editando = null;
                productos.splice(indice, 1);
                guardar();
            } else if (e.target.classList.contains('btn-editar')) {
                editando = indice;
                renderizar();
            }
        });

        lista.addEventListener('change', e => {
            if (!e.target.classList.contains('check-comprado')) return;
            const indice = Number(e.target.closest('li').dataset.indice);
            productos[indice].comprado = e.target.checked;
            guardar();
        });

        lista.addEventListener('keydown', e => {
            if (!e.target.classList.contains('input-edicion')) return;
            if (e.key === 'Enter') {
                guardarEdicion(e.target.value);
            } else if (e.key === 'Escape') {
                editando = null;
                renderizar();
            }
        });

        lista.addEventListener('focusout', e => {
            if (e.target.classList.contains('input-edicion')) guardarEdicion(e.target.value);
        });

        document.getElementById('btn-ordenar').addEventListener('click', ordenarLista);
        document.getElementById('btn-limpiar').addEventListener('click', limpiarLista);

        function handlerFormulario(evento) {
            evento.preventDefault();
            const input = evento.target.querySelector('input');
            const nombreProducto = input.value;
            input.value = "";
            agregarProducto(nombreProducto);
        }

        document.querySelector('form').addEventListener('submit', handlerFormulario);

        renderizar();
    </script>
</body>
</html>
