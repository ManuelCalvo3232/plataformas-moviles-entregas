<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tablero de Puntos - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Tablero de Puntos</h1>
        <div class="card">
            <div class="card-body">
                <div class="row text-center">
                    <div class="col-5">
                        <span id="marcador-local" class="display-1">0</span>
                        <input type="text" id="nombre-local" class="form-control text-center my-2" value="Local" aria-label="Nombre del equipo local">
                        <input type="color" id="color-local" class="form-control form-control-color mx-auto" value="#0d6efd" title="Color del equipo local" aria-label="Color del equipo local">
                    </div>
                    <div class="col-2">
                        <span class="display-1">:</span>
                    </div>
                    <div class="col-5">
                        <span id="marcador-visitante" class="display-1">0</span>
                        <input type="text" id="nombre-visitante" class="form-control text-center my-2" value="Visitante" aria-label="Nombre del equipo visitante">
                        <input type="color" id="color-visitante" class="form-control form-control-color mx-auto" value="#dc3545" title="Color del equipo visitante" aria-label="Color del equipo visitante">
                    </div>
                </div>

                <p id="estado" class="text-center fw-bold text-danger mt-2 mb-0"></p>

                <hr class="hr">

                <h2>Actualizar Contador</h2>
                <div class="row">
                    <div class="col-12 col-sm-4 my-1">
                        <button id="btn-punto-local" class="btn d-block w-100 btn-primary btn-puntaje">
                            Punto Local
                        </button>
                    </div>
                    <div class="col-12 col-sm-4 my-1">
                        <button id="btn-punto-visitante" class="btn d-block w-100 btn-primary btn-puntaje">
                            Punto Visitante
                        </button>
                    </div>
                    <div class="col-12 col-sm-4 my-1">
                        <button id="btn-reinicio" class="btn d-block w-100 btn-danger">
                            Reinicio
                        </button>
                    </div>
                </div>

                <h2 class="mt-3">Ajustes</h2>
                <div class="row">
                    <div class="col-12 col-sm-3 my-1">
                        <button id="btn-menos-local" class="btn d-block w-100 btn-outline-secondary btn-puntaje">
                            Local -1
                        </button>
                    </div>
                    <div class="col-12 col-sm-3 my-1">
                        <button id="btn-menos-visitante" class="btn d-block w-100 btn-outline-secondary btn-puntaje">
                            Visitante -1
                        </button>
                    </div>
                    <div class="col-12 col-sm-3 my-1">
                        <button id="btn-invertir" class="btn d-block w-100 btn-outline-dark">
                            Invertir puntaje
                        </button>
                    </div>
                    <div class="col-12 col-sm-3 my-1">
                        <button id="btn-finalizar" class="btn d-block w-100 btn-outline-success">
                            Finalizar partido
                        </button>
                    </div>
                </div>

                <p class="text-muted small mt-3 mb-0">
                    Atajos: <kbd>L</kbd> punto local, <kbd>V</kbd> punto visitante, <kbd>R</kbd> reinicio, <kbd>I</kbd> invertir, <kbd>F</kbd> finalizar.
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script type="text/javascript">
        const puntos = { local: 0, visitante: 0 };
        let finalizado = false;

        const marcadores = {
            local: document.getElementById('marcador-local'),
            visitante: document.getElementById('marcador-visitante')
        };
        const botonesPuntaje = document.querySelectorAll('.btn-puntaje');
        const btnFinalizar = document.getElementById('btn-finalizar');
        const estado = document.getElementById('estado');

        function actualizarMarcador() {
            marcadores.local.textContent = puntos.local;
            marcadores.visitante.textContent = puntos.visitante;
            botonesPuntaje.forEach(boton => boton.disabled = finalizado);
            btnFinalizar.disabled = finalizado;
            estado.textContent = finalizado ? 'Partido finalizado' : '';
        }

        function ajustarPuntos(equipo, cantidad) {
            if (finalizado) return;
            puntos[equipo] = Math.max(0, puntos[equipo] + cantidad);
            actualizarMarcador();
        }

        function invertirPuntaje() {
            [puntos.local, puntos.visitante] = [puntos.visitante, puntos.local];
            actualizarMarcador();
        }

        function finalizarPartido() {
            finalizado = true;
            actualizarMarcador();
        }

        function reiniciar() {
            puntos.local = 0;
            puntos.visitante = 0;
            finalizado = false;
            actualizarMarcador();
        }

        document.getElementById('btn-punto-local').addEventListener('click', () => ajustarPuntos('local', 1));
        document.getElementById('btn-punto-visitante').addEventListener('click', () => ajustarPuntos('visitante', 1));
        document.getElementById('btn-menos-local').addEventListener('click', () => ajustarPuntos('local', -1));
        document.getElementById('btn-menos-visitante').addEventListener('click', () => ajustarPuntos('visitante', -1));
        document.getElementById('btn-invertir').addEventListener('click', invertirPuntaje);
        btnFinalizar.addEventListener('click', finalizarPartido);
        document.getElementById('btn-reinicio').addEventListener('click', reiniciar);

        document.getElementById('color-local').addEventListener('input', e => marcadores.local.style.color = e.target.value);
        document.getElementById('color-visitante').addEventListener('input', e => marcadores.visitante.style.color = e.target.value);

        const atajos = {
            l: () => ajustarPuntos('local', 1),
            v: () => ajustarPuntos('visitante', 1),
            r: reiniciar,
            i: invertirPuntaje,
            f: finalizarPartido
        };
        document.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey || e.altKey || e.target.tagName === 'INPUT') return;
            const accion = atajos[e.key.toLowerCase()];
            if (accion) accion();
        });

        actualizarMarcador();
    </script>
</body>
</html>
