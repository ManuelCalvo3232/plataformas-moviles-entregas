<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Contactos - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Lista de Contactos</h1>
        <div class="card">
            <div class="card-body">
                <h2>Contactos</h2>

                <div class="row g-2 align-items-end mb-3">
                    <div class="col-12 col-md-4">
                        <label for="criterio" class="form-label mb-1">Ordenar por</label>
                        <select id="criterio" class="form-select">
                            <option value="nombre">Nombre</option>
                            <option value="apellido">Apellido</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-5">
                        <label for="buscador" class="form-label mb-1">Buscar</label>
                        <input type="search" id="buscador" class="form-control" placeholder="Nombre, apellido o teléfono">
                    </div>
                    <div class="col-12 col-md-3">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="solo-favoritos">
                            <label class="form-check-label" for="solo-favoritos">Solo favoritos</label>
                        </div>
                    </div>
                </div>

                <ul id="lista-contactos" class="list-unstyled mb-3"></ul>

                <button id="btn-eliminar-seleccionados" type="button" class="btn btn-outline-danger mb-3">Eliminar seleccionados</button>

                <hr class="hr">

                <h2>Nuevo Contacto</h2>
                <form id="form-producto">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" name="nombre" id="input-nombre" placeholder="Nombre" aria-label="Nombre">
                        <input type="text" class="form-control" name="apellido" id="input-apellido" placeholder="Apellido" aria-label="Apellido">
                        <input type="tel" class="form-control" name="telefono" id="input-telefono" placeholder="Teléfono" aria-label="Teléfono">
                    </div>
                    <button class="btn btn-primary" type="submit">Agregar Contacto</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script type="text/javascript">
        let contactos = [
            {
                id: 1,
                nombre: 'Juan',
                apellido: 'Perez',
                telefono: '',
                favorito: false,
            },
        ];
        let siguienteId = 2;
        let editandoId = null;
        const seleccionados = new Set();

        const lista = document.getElementById('lista-contactos');
        const criterio = document.getElementById('criterio');
        const buscador = document.getElementById('buscador');
        const soloFavoritos = document.getElementById('solo-favoritos');

        /**
         * agregarContacto()
         * esta función se va a llamar cuando el usuario envía el formulario con el nuevo contacto para agregar.
         */
        function agregarContacto(nombre, apellido, telefono = '') {
            const nombreLimpio = nombre.trim();
            const apellidoLimpio = apellido.trim();
            if (nombreLimpio === '' || apellidoLimpio === '') return;
            contactos.push({
                id: siguienteId++,
                nombre: nombreLimpio,
                apellido: apellidoLimpio,
                telefono: telefono.trim(),
                favorito: false,
            });
            mostrarListado();
        }

        function compararContactos(a, b) {
            const principal = criterio.value;
            const secundario = principal === 'nombre' ? 'apellido' : 'nombre';
            return a[principal].localeCompare(b[principal], 'es') || a[secundario].localeCompare(b[secundario], 'es');
        }

        function contactosVisibles() {
            const termino = buscador.value.trim().toLowerCase();
            return contactos
                .filter(c => !soloFavoritos.checked || c.favorito)
                .filter(c => [c.nombre, c.apellido, c.telefono].some(valor => valor.toLowerCase().includes(termino)))
                .sort(compararContactos);
        }

        /**
         * mostrarListado()
         * esta función se encarga de mostrar en el DOM la lista de todos los contactos guardados en la variable global contactos.
         */
        function mostrarListado() {
            lista.innerHTML = '';
            contactosVisibles().forEach(contacto => lista.appendChild(crearItem(contacto)));
        }

        function crearBoton(texto, clases) {
            const boton = document.createElement('button');
            boton.type = 'button';
            boton.className = clases;
            boton.textContent = texto;
            return boton;
        }

        function crearItem(contacto) {
            const li = document.createElement('li');
            li.className = 'd-flex flex-wrap justify-content-between align-items-center gap-2 border rounded p-2 mb-2';
            li.dataset.id = contacto.id;

            const izquierda = document.createElement('div');
            izquierda.className = 'd-flex align-items-center gap-2 flex-grow-1';

            const seleccion = document.createElement('input');
            seleccion.type = 'checkbox';
            seleccion.className = 'form-check-input mt-0 check-seleccion';
            seleccion.checked = seleccionados.has(contacto.id);
            izquierda.appendChild(seleccion);

            if (contacto.id === editandoId) {
                [['nombre', 'Nombre', 'text'], ['apellido', 'Apellido', 'text'], ['telefono', 'Teléfono', 'tel']].forEach(([clave, etiqueta, tipo]) => {
                    const input = document.createElement('input');
                    input.type = tipo;
                    input.className = 'form-control form-control-sm campo-edicion';
                    input.dataset.campo = clave;
                    input.placeholder = etiqueta;
                    input.setAttribute('aria-label', etiqueta);
                    input.value = contacto[clave];
                    izquierda.appendChild(input);
                });
            } else {
                const texto = document.createElement('span');
                texto.textContent = `${contacto.apellido}, ${contacto.nombre}`;
                izquierda.appendChild(texto);
                if (contacto.telefono) {
                    const tel = document.createElement('small');
                    tel.className = 'text-muted';
                    tel.textContent = contacto.telefono;
                    izquierda.appendChild(tel);
                }
            }

            const derecha = document.createElement('div');
            derecha.className = 'd-flex gap-2';

            if (contacto.id === editandoId) {
                derecha.append(
                    crearBoton('Guardar', 'btn btn-sm btn-success btn-guardar'),
                    crearBoton('Cancelar', 'btn btn-sm btn-outline-secondary btn-cancelar')
                );
            } else {
                const btnFavorito = crearBoton(contacto.favorito ? '★ Favorito' : '☆ Favorito', 'btn btn-sm btn-outline-warning btn-favorito');
                btnFavorito.setAttribute('aria-pressed', contacto.favorito);
                derecha.append(
                    btnFavorito,
                    crearBoton('Editar', 'btn btn-sm btn-outline-primary btn-editar'),
                    crearBoton('Eliminar', 'btn btn-sm btn-outline-danger btn-eliminar')
                );
            }

            li.append(izquierda, derecha);
            return li;
        }

        function idDelItem(elemento) {
            return Number(elemento.closest('li').dataset.id);
        }

        function buscarContacto(id) {
            return contactos.find(c => c.id === id);
        }

        function eliminarContactos(ids) {
            contactos = contactos.filter(c => !ids.has(c.id));
            ids.forEach(id => seleccionados.delete(id));
            if (ids.has(editandoId)) editandoId = null;
            mostrarListado();
        }

        lista.addEventListener('click', e => {
            const boton = e.target;
            if (boton.classList.contains('btn-favorito')) {
                const contacto = buscarContacto(idDelItem(boton));
                contacto.favorito = !contacto.favorito;
                mostrarListado();
            } else if (boton.classList.contains('btn-editar')) {
                editandoId = idDelItem(boton);
                mostrarListado();
            } else if (boton.classList.contains('btn-eliminar')) {
                eliminarContactos(new Set([idDelItem(boton)]));
            } else if (boton.classList.contains('btn-guardar')) {
                const li = boton.closest('li');
                const nombre = li.querySelector('[data-campo="nombre"]').value.trim();
                const apellido = li.querySelector('[data-campo="apellido"]').value.trim();
                if (nombre === '' || apellido === '') return;
                const contacto = buscarContacto(idDelItem(boton));
                contacto.nombre = nombre;
                contacto.apellido = apellido;
                contacto.telefono = li.querySelector('[data-campo="telefono"]').value.trim();
                editandoId = null;
                mostrarListado();
            } else if (boton.classList.contains('btn-cancelar')) {
                editandoId = null;
                mostrarListado();
            }
        });

        lista.addEventListener('change', e => {
            if (!e.target.classList.contains('check-seleccion')) return;
            const id = idDelItem(e.target);
            if (e.target.checked) seleccionados.add(id);
            else seleccionados.delete(id);
        });

        document.getElementById('btn-eliminar-seleccionados').addEventListener('click', () => {
            eliminarContactos(new Set(seleccionados));
        });

        criterio.addEventListener('change', mostrarListado);
        buscador.addEventListener('input', mostrarListado);
        soloFavoritos.addEventListener('change', mostrarListado);

        function handlerFormulario(e) {
            e.preventDefault();
            const inputNombre = e.target.querySelector('#input-nombre');
            const inputApellido = e.target.querySelector('#input-apellido');
            const inputTelefono = e.target.querySelector('#input-telefono');

            const nombre = inputNombre.value;
            const apellido = inputApellido.value;
            const telefono = inputTelefono.value;

            inputNombre.value = "";
            inputApellido.value = "";
            inputTelefono.value = "";

            agregarContacto(nombre, apellido, telefono);
        }

        document.querySelector('form').addEventListener('submit', handlerFormulario);

        mostrarListado();
    </script>
</body>
</html>
